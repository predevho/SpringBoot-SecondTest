<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.au/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>게시글 상세</title>
</head>
<body>
<th:block layout:fragment="content">
    <h1>게시글 상세</h1>

    <table border="1">
        <tr>
            <th>번호</th>
            <td th:text="${article.id}"></td>
        </tr>
        <tr>
            <th>제목</th>
            <td th:text="${article.title}"></td>
        </tr>
        <tr>
            <th>내용</th>
            <td th:text="${article.content}"></td>
        </tr>
        <tr>
            <th>작성일</th>
            <td th:text="${#temporals.format(article.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
    </table>
    <a th:href="@{/article/modify/{id}(id=${article.id})}"><button>수정</button></a>
    <form id="deleteForm" th:action="@{/article/delete/{id}(id=${article.id})}" method="post" style="display:inline">
        <button type="button" class="delete">삭제</button>
    </form>
    <a th:href="@{/article/list}"><button type="button">목록으로</button></a>
</th:block>

<th:block layout:fragment="script">
    <script type='text/javascript'>
        const delete_elements = document.getElementsByClassName("delete");
        Array.from(delete_elements).forEach(function(element) {
            element.addEventListener('click', function() {
                if(confirm("정말로 삭제하시겠습니까?")) {
                    document.getElementById("deleteForm").submit();
                }
            });
        });
    </script>
</th:block>
</body>
</html>
