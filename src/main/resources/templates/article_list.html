<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
</head>
<body>
    <h1>게시글 목록</h1>
    <a th:href="@{/article/create}"><button>등록</button></a>

    <table border="1">
        <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>내용</th>
                <th>작성일</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="article : ${articleList}">
                <td th:text="${article.id}"></td>
                <td><a th:href="@{/article/detail/{id}(id=${article.id})}" th:text="${article.title}"></a></td>
                <td th:text="${article.content}"></td>
                <td th:text="${#temporals.format(article.createDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(articleList)}">
                <td colspan="4">게시글이 없습니다.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
