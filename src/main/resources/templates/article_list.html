<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.au/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>게시글 목록</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>게시글 목록</h2>
            <a th:href="@{/article/create}" class="btn btn-primary">등록</a>
        </div>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>내용</th>
                    <th>작성일</th>
                    <th>수정일</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articleList}">
                    <td th:text="${article.id}"></td>
                    <td><a th:href="@{/article/detail/{id}(id=${article.id})}" th:text="${article.title}"></a></td>
                    <td th:text="${article.content}"></td>
                    <td th:text="${#temporals.format(article.createDate, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${article.modifyDate != null ? #temporals.format(article.modifyDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(articleList)}">
                    <td colspan="5" class="text-center text-muted">게시글이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>
</th:block>
</body>
</html>
