<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
</head>
<body>
    <h1>게시글 수정</h1>
    <form th:action="@{/article/modify/{id}(id=${article.id})}" method="post">
        <div>
            <label for="title">제목</label>
            <input type="text" id="title" name="title" th:value="${article.title}" placeholder="제목을 입력하세요">
        </div>
        <div>
            <label for="content">내용</label>
            <textarea id="content" name="content" placeholder="내용을 입력하세요" th:text="${article.content}"></textarea>
        </div>
        <button type="submit">수정</button>
        <a th:href="@{/article/detail/{id}(id=${article.id})}"><button type="button">취소</button></a>
    </form>
</body>
</html>
